# Issue runner config. Edit here when the repo moves.
repo = "igalgerman/oren_study"   # gh --repo
remote = "origin"
branch = "main"
model = "sonnet"
max_parallel = 3
worktree_prefix = "C:/work/Oren_study/wt-"
bash = "C:/Program Files/Git/bin/bash.exe"   # Git Bash (not WSL's bash)
extra_path = "/c/work/Oren_study/bin"        # python3 shim
stuck_hours = 2
park_minutes = 30               # a worker/reviewer waiting for the owner this long: issue parked (blocked + ready-for-human), lane freed, windows stay open
hc = "C:/Users/97254/AppData/Local/Programs/herdr-core/hc.exe"   # herdr CLI; if missing the runner falls back to hidden `claude -p`
parent = ""                     # herdr terminal that gets the notes (e.g. "t2g"); empty = the terminal that started run.cmd

# give each worker/reviewer its own tab in the Herdr app
show = true
