# Issue runner config. Edit here when the repo moves.
repo = "igalgerman/oren_study"   # gh --repo
remote = "origin"
branch = "main"
model = "sonnet"
local_lanes = 0                 # #133: worker windows on this PC (owner 26 Nov: 0, the PC froze; all workers in the cloud)
remote_lanes = 6                # #133: cloud sessions (tools/runner/remote.py); a local lane busy + a remote slot free -> the worker runs in the cloud
# #239/#705 usage governor: cloud lanes follow the remaining WEEK budget evenly, re-planned every pass (panel writes .runs/usage.json); the 5h window is only a cap
governor_stop = 99              # 5h at/above this %: no new run (week-only plan: no 5h stop)
governor_reserve = 5            # owner reserve %: week ceiling C = 99 - reserve, released over the last governor_reserve_release_h hours
governor_reserve_release_h = 12
governor_5h_cap = 97            # lanes never plan the 5h window past this % (a cap, not a goal)
governor_ceiling = 16           # sanity ceiling against bugs only
governor_week_stop = 97         # #698 owner 28 Nov: week at/above this %: no new run (runs in flight finish) until the weekly reset
express_lanes = 2               # #72: extra lanes for issues labelled express (owner-approved), on top of the local + remote lanes (26 Nov: 2, two express P0s at once)
max_core = 8                    # owner 28 Nov: 5 -> 8 (14 core issues waited with lanes free)
worktree_prefix = "C:/work/Oren_study/wt-"
bash = "C:/Program Files/Git/bin/bash.exe"   # Git Bash (not WSL's bash)
extra_path = "/c/work/Oren_study/bin"        # python3 shim
main_checkout = "C:/work/Oren_study/a"   # fast-forwarded after each integrate and every sync_minutes by the watchdog
sync_minutes = 3
stuck_hours = 2
park_minutes = 30               # a worker/reviewer waiting for the owner this long: issue parked (blocked + ready-for-human), lane freed, windows stay open
hc = "C:/Users/97254/AppData/Local/Programs/herdr-core/hc.exe"   # herdr CLI; if missing the runner falls back to hidden `claude -p`
parent = ""                     # herdr terminal that gets the notes (e.g. "t2g"); empty = the terminal that started run.cmd

# give each worker/reviewer its own tab in the Herdr app
# Herdr space where worker/reviewer tabs open (by name)
herdr_space = "oren-workers"   # #25: worker/review windows, kept out of the main space
control_space = "oren"           # #140/#25: the ONE main space: tabs orchestrator, inbox, inspector (tools/orchestrator.cmd, recover.cmd, the watchdog); runner + watchdog have no tab
recover_issue = 138              # #140: recover reports what it did in one comment on this issue (freeze/recover epic)

# acting observer (observer.py, rules only), run by the watchdog every N minutes
observer_minutes = 10   # 0 = off
ai_observer_minutes = 60   # #203: AI observer (ai_observer.py, headless Sonnet, read-only), findings to the orchestrator; 0 = off
ai_observer_where = "cloud"     # #289: "cloud" = an hourly cloud scheduled task posts on the ai-observer issue, the watchdog relays it (no claude on the PC); "local" = headless run here
canary_minutes = 60              # #538: at most one canary run (canary.py) per this many minutes
status_minutes = 10             # #306: cloud desks (desks.py): pinned links + live status every N min; keep-alive of the two cloud sessions; 0 = off
desk_probe_hours = 12           # #306: a PING to each cloud desk this often; no answer -> a new session
retro_hour = 23                 # #219: nightly retro + handoff (nightly.py, headless Sonnet, read-only) at this local hour; 0 = off
retro_where = "cloud"           # #289: "cloud" = a nightly cloud scheduled task opens 'Daily retro <date>'; the watchdog only writes the handoffs; "local" = headless run here
inspector_handoff = "C:/work/Oren_study/INSPECTOR_HANDOFF.md"   # #219: the nightly run refreshes its UPDATE section
pregen = false   # #325: voice pregen runs in GitHub Actions after each deploy (deploy_in_ci); the PC never starts it
deploy_in_ci = true             # #192: deploy + voice pregen run in GitHub Actions (.github/workflows/deploy.yml); false = the runner deploys from the PC with .env
code_mode_every = 3             # Code Mode trial (owner 26 Nov): issues # divisible by 3 run Claude with CLAUDE_CODE_EXPERIMENTAL_CODE_MODE=1; 0 = off
ai_model = "haiku"              # #171: model for the dashboard AI assessment (hourly, watchdog); "" = off

ci_merge = true                 # #74: merge on a green PR "tests" check (gh pr merge --squash) instead of the local full suite; false = old integrate.sh
ci_timeout_minutes = 60

# #363 step A: the bots' gh calls use a GitHub App installation token (own rate limits); Claude sessions keep the owner login.
# Not secret: the ids. The key file stays OUTSIDE the repo (never commit, print or copy it). Remove/0 the id = owner login again.
github_app_id = 5939551
github_app_installation_id = 186191764
github_app_key = "C:/Users/97254/.oren/app.pem"

# #710 usage alarms (usage_alarms.py): each rule fires at most once per usage_alarm_every_h hours
usage_alarm_every_h = 3
usage_underuse_pct = 94         # UNDERUSE: week + (b*N_hi + b0)*H below this = budget left over even at full speed
usage_idle_min = 60             # IDLE: need > 0 while busy lanes < lanes for longer than this
usage_behind_ratio = 0.5        # BEHIND: actual burn over usage_behind_h below this share of need
usage_behind_h = 3
usage_overuse_pct = 100         # OVERUSE: projected week % at the reset at or above this

# #800: trusted authors of control lines (trust.py)
owner_login = "igalgerman"
bot_logins = ["oren-study-bot", "oren-study-bot[bot]"]
# Before this time an ANSWERED line / owner-answer record written by the owner login still counts (PR #807 moved control lines to the App bot); after it only the bot counts.
trust_since = "2026-11-28T12:28:45Z"
