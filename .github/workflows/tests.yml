name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playwright
        working-directory: oren2
        run: |
          npm i --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Shard split check
        working-directory: oren2
        run: bash tests/shard.test.sh
      - name: Run suites (shard ${{ matrix.shard }}/6)
        working-directory: oren2
        env:
          SUITES_SHARD: ${{ matrix.shard }}/6
          RETRY_ALONE: '1'      # a suite that fails under load is rerun alone once (#60)
          JOBS: '3'
        run: bash tests/run.sh
  tests:
    # The one required check: a PR is mergeable when this is green.
    if: always()
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.shard.result }}" = success ] || { echo "a test shard failed: ${{ needs.shard.result }}"; exit 1; }
