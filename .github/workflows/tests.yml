name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # #192 P0: never cancel a main run, or deploy.yml (needs a successful push run) never fires
permissions:
  contents: read
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 12      # #187: a shard takes ~2-4 min; RUN_BUDGET below fails it at 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playwright
        working-directory: oren2
        run: |
          npm i --no-save --no-package-lock playwright
          # retry: the browser download sometimes fails with a TLS error (#614)
          for i in 1 2 3; do npx playwright install --with-deps chromium && break
            [ $i = 3 ] && exit 1; echo "playwright install failed, retry $i"; sleep $((i*10)); done
      - name: Shard split check
        working-directory: oren2
        run: bash tests/shard.test.sh
      - name: Time budget check
        working-directory: oren2
        run: bash tests/budget.test.sh
      - name: Run suites (shard ${{ matrix.shard }}/6)
        working-directory: oren2
        env:
          SUITES_SHARD: ${{ matrix.shard }}/6
          RETRY_ALONE: '1'      # a suite that fails under load is rerun alone once (#60)
          JOBS: '3'
          RUN_BUDGET: '480'     # #187: the whole shard over 8 min fails (per-suite budgets: tests/budget.txt; table in the step summary)
        run: bash tests/run.sh
      - name: Keep suite times for the test gardener (tools/test_garden.py)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: times-${{ matrix.shard }}
          path: oren2/tests/.tmp/times.tsv
          retention-days: 35
          if-no-files-found: ignore
  ci:
    # Game CI helpers (oren2/ci): build check + their unit tests. Needs only the game files (#794).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build check (a fresh build_talents.py on the merged tree changes no built file, #503)
        run: python3 oren2/ci/buildcheck.py
      - name: Game CI tests
        run: |
          fail=0
          for t in oren2/ci/test_*.py; do
            echo "== $t"; python3 "$t" || { echo "FAILED: $t"; fail=1; }
          done
          exit $fail
  tools:
    # INFRA side only (#152, #794): runner / watchdog / ask / panel tests, python + node, no install, < 1 min.
    # A game-only checkout has no tools/: the steps skip and the job is green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tool tests
        if: hashFiles('tools/runner/runner.py') != ''
        run: |
          fail=0
          for t in tools/runner/test_*.py tools/split/test_*.py tools/test_*.py tools/ask/test/*_test.py; do
            echo "== $t"; python3 "$t" || { echo "FAILED: $t"; fail=1; }
          done
          exit $fail
      - name: Panel tests
        if: hashFiles('tools/mods/oren-lanes/run-tests.mjs') != ''
        run: node tools/mods/oren-lanes/run-tests.mjs
      - name: Model status line tests
        if: hashFiles('tools/mods/oren-model/run-tests.mjs') != ''
        run: node tools/mods/oren-model/run-tests.mjs
  tests:
    # The one required check: a PR is mergeable when this is green.
    if: always()
    needs: [shard, ci, tools]
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.shard.result }}" = success ] || { echo "a test shard failed: ${{ needs.shard.result }}"; exit 1; }
          [ "${{ needs.ci.result }}" = success ] || { echo "the game CI tests failed: ${{ needs.ci.result }}"; exit 1; }
          [ "${{ needs.tools.result }}" = success ] || { echo "the tools tests failed: ${{ needs.tools.result }}"; exit 1; }
