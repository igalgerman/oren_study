# Deploy + voice pregen in GitHub Actions (#192): 0 work on the PC.
# Runs after the "tests" workflow succeeded on a push to main (only the newest commit deploys), and every 15 min for the newest green main.
# Needs the repo secret CLOUDFLARE_API_TOKEN (the owner adds it once: Settings > Secrets and variables > Actions).
name: deploy
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'    # deploys the newest green main if it never went live (a cancelled or skipped run, #192)
  workflow_dispatch:          # manual run (e.g. right after the secret was added): deploys the newest main
permissions:
  contents: read
  actions: read               # plan: Actions caches (deploy-attempt-<sha>) and the newest green tests run
jobs:
  plan:
    # which sha deploys ("" = nothing to do): the green commit if it is still the newest main; every 15 min the newest green main
    # if its deploy was never tried (cancelled/skipped runs never leave merged work off the site); manual: the newest main
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ci
            tools/runner
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          export MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          export GREEN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          python3 tools/ci/deploy_ci.py plan

  deploy:
    needs: plan
    if: needs.plan.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production        # one GitHub deployment per real deploy: the dashboard reads them (ok/failed, time, URL)
      url: ${{ steps.report.outputs.url }}
    concurrency:
      group: deploy-main
      cancel-in-progress: false   # a running deploy is never cancelled (an older run could then put its sha live); GitHub keeps only the newest pending run
    outputs:
      deployed: ${{ steps.report.outputs.ok }}
      tour: ${{ steps.tour.outputs.tour }}
      repro: ${{ steps.tour.outputs.repro }}
      prev: ${{ steps.tour.outputs.prev }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Guard (is the planned sha still the newest? an older one never overwrites a newer one)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PLAN_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          export MAIN_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          export GREEN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          python3 tools/ci/deploy_ci.py guard
      - name: Mark this sha as tried (the 15-min check never deploys it again)
        if: steps.guard.outputs.current == 'true'
        run: mkdir -p ~/.deploy-attempt && echo "${{ needs.plan.outputs.sha }}" > ~/.deploy-attempt/sha
      - uses: actions/cache/save@v4
        if: steps.guard.outputs.current == 'true'
        continue-on-error: true   # a second run for the same sha: the key exists already
        with:
          path: ~/.deploy-attempt
          key: deploy-attempt-${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.current == 'true'
        with:
          python-version: '3.12'
      - name: Deploy (build + deploy.sh)
        if: steps.guard.outputs.current == 'true'
        working-directory: oren2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "no token: the owner adds the repo secret CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/deploy.log"; exit 0; fi
          bash cf/tools/deploy.sh 2>&1 | tee "$RUNNER_TEMP/deploy.log" || true
      - name: Summary
        if: steps.guard.outputs.current == 'true'
        id: report
        run: python3 tools/ci/deploy_ci.py report "$RUNNER_TEMP/deploy.log"
      - name: Live smoke check, deployment URL + production (page, save round trip then deleted, D1 bound, /api/tts/status; #150)
        # a failure fails this job: the GitHub deployment is failed (dashboard deploy event ok=false) and deploy-failed raises the P0 alarm
        if: steps.guard.outputs.current == 'true'
        run: python3 tools/ci/deploy_ci.py smoke "${{ steps.report.outputs.url }}" https://oren-game.pages.dev
      # #618: the fixed regression tour of the core experience on production (tools/ci/tour.js, real browser, desktop + phone).
      # It never fails this job (the site is live already): a fail -> tour-failed opens a P0 bug (+ undo when the previous tour passed).
      - name: Previous tour result
        if: steps.guard.outputs.current == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.tour
          key: tour-last-${{ github.run_id }}
          restore-keys: tour-last-
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.current == 'true'
        with:
          node-version: 22
      - name: Regression tour on production
        id: tour
        if: steps.guard.outputs.current == 'true'
        timeout-minutes: 10
        run: |
          echo "prev=$(cat ~/.tour/last 2>/dev/null)" >> "$GITHUB_OUTPUT"
          { npm i --no-save --no-package-lock playwright && npx playwright install --with-deps chromium; } > "$RUNNER_TEMP/pw.log" 2>&1 || tail -20 "$RUNNER_TEMP/pw.log"
          node tools/ci/tour.js https://oren-game.pages.dev > "$RUNNER_TEMP/tour.log" 2>&1 || true
          cat "$RUNNER_TEMP/tour.log"
          python3 tools/ci/deploy_ci.py tour "$RUNNER_TEMP/tour.log"
          mkdir -p ~/.tour; if grep -q '^TOUR: PASS' "$RUNNER_TEMP/tour.log"; then echo pass > ~/.tour/last; else echo fail > ~/.tour/last; fi
      - uses: actions/cache/save@v4
        if: steps.guard.outputs.current == 'true'
        continue-on-error: true
        with:
          path: ~/.tour
          key: tour-last-${{ github.run_id }}-${{ github.run_attempt }}

  tour-failed:
    # #618: the post-deploy tour failed on production -> ONE P0 bug with the repro (per deploy sha); the tour passed on the
    # previous deploy -> the issue is also an express undo (revert of the last merge through the normal flow, .claude/commands/undo.md)
    needs: [plan, deploy]
    if: needs.deploy.outputs.tour == 'fail'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/ci
            tools/runner
      - name: Names list present (#876)
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
        run: python3 tools/runner/scrub.py require || echo "::error::PRIVATE_NAMES secret is empty, the name scrub replaces nothing (#876)"
      - env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.plan.outputs.sha }}
          REPRO: ${{ needs.deploy.outputs.repro }}
          PREV: ${{ needs.deploy.outputs.prev }}
        run: |
          export TITLE=$(gh api "repos/$GH_REPO/commits/$SHA" --jq '.commit.message' | head -1)
          python3 tools/ci/deploy_ci.py tour-issue

  deploy-failed:
    # one issue "Deploy failed" (P0): opened once, then commented on each new failure
    needs: [plan, deploy]
    if: failure() && (needs.deploy.result == 'failure' || needs.plan.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          body="Deploy of $SHA failed (deploy or live smoke check). Nothing new went live. Log: $RUN"
          n=$(gh issue list --state open --search 'in:title "Deploy failed"' --json number,title --jq '[.[] | select(.title == "Deploy failed")][0].number')
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --title "Deploy failed" --label P0 --body "$body"; fi

  pregen:
    # voice pregen: its own job, own timeout and own queue, so it never blocks or delays a deploy
    needs: [plan, deploy]
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      statuses: write             # #400: the voice-missing commit status (the runner dashboard reads it)
    concurrency:
      group: pregen-main
      cancel-in-progress: false   # a newer deploy never cancels a running pregen (it is resumable): one at a time, the newest waits
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install playwright
        working-directory: oren2
        run: |
          npm i --no-save --no-package-lock playwright
          # retry: the browser download sometimes fails with a TLS error (#614)
          for i in 1 2 3; do npx playwright install --with-deps chromium && break
            [ $i = 3 ] && exit 1; echo "playwright install failed, retry $i"; sleep $((i*10)); done
      - name: Build
        working-directory: oren2
        run: python3 build_talents.py
      - name: Restore pregen state (done texts + today's count)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/oren-pregen
          key: pregen-state-${{ github.run_id }}
          restore-keys: pregen-state-
      - name: Voice pregen
        run: node oren2/cf/tools/pregen.js
      - name: Restore voice check state (#405)
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/oren-voicecheck
          key: voicecheck-state-${{ github.run_id }}
          restore-keys: voicecheck-state-
      - name: Voice check (#405)
        # pronunciation + nikud check over ALL kid sentences of the pregen list, resumable: each run checks the next ones
        # (Gemini via the site, no secret here) and ends with the findings list in the job summary; never fails the job
        # #570: the sweep runs once a day and keeps a reserve of Gemini calls for --pages (summary: 'sweep skipped' / 'reserve kept')
        if: always()
        continue-on-error: true
        timeout-minutes: 50
        env:
          MAX_MIN: 40
        run: node oren2/cf/tools/voicecheck.js
      - name: Save voice check state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/oren-voicecheck
          key: voicecheck-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Voice missing report
        # #400: read-only; count + first 20 kid sentences with no recording yet (log + job summary). A count is not a failure.
        if: always()
        id: voicemiss
        run: node oren2/cf/tools/voicemissing.js
      - name: Post voice-missing status (dashboard)
        if: always() && steps.voicemiss.outputs.text != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TEXT: ${{ steps.voicemiss.outputs.text }}
        run: gh api "repos/${{ github.repository }}/statuses/${{ needs.plan.outputs.sha }}" -f state=success -f context=voice-missing -f description="$TEXT" >/dev/null || echo "could not post the voice-missing status"
      - name: Save pregen state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/oren-pregen
          key: pregen-state-${{ github.run_id }}-${{ github.run_attempt }}
